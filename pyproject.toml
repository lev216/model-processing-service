[project]
name = "model-processing-service"
version = "0.1.0"
description = "Model processing service with AutoML to train model and use it for predictions"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "prometheus-fastapi-instrumentator>=0.9",
    "python-logging-loki>=0.3",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2",
    "mlflow==3.12.0",
    "apscheduler>=3.10.0,<4.0.0",
]

[project.scripts]
serve = "app.main:run"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff==0.16.10",
    "pre-commit==4.6.2",
    "anyio>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
omit = [
    "tests/*",
]
[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
"autogluon.timeseries" = "1.4.0"
torch = [
  { version = "2.2.2+cpu", source = "pytorch-cpu", markers = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { version = "2.2.2", markers = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
