<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1460" width="1120" height="1460" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b4a5c"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3402f"/></marker></defs><rect x="0" y="0" width="1120" height="210" fill="#f4f6f8"/><rect x="0" y="0" width="44" height="210" fill="#dde3ea"/><text transform="translate(22.0,105.0) rotate(-90)" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1f2a37">Триггер</text><rect x="0" y="210" width="1120" height="290" fill="#fafbfc"/><rect x="0" y="210" width="44" height="290" fill="#dde3ea"/><text transform="translate(22.0,355.0) rotate(-90)" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1f2a37">Подготовка данных</text><rect x="0" y="500" width="1120" height="150" fill="#f4f6f8"/><rect x="0" y="500" width="44" height="150" fill="#dde3ea"/><text transform="translate(22.0,575.0) rotate(-90)" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1f2a37">Обучение</text><rect x="0" y="650" width="1120" height="280" fill="#fafbfc"/><rect x="0" y="650" width="44" height="280" fill="#dde3ea"/><text transform="translate(22.0,790.0) rotate(-90)" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1f2a37">Проверка качества</text><rect x="0" y="930" width="1120" height="390" fill="#f4f6f8"/><rect x="0" y="930" width="44" height="390" fill="#dde3ea"/><text transform="translate(22.0,1125.0) rotate(-90)" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1f2a37">Регистрация и деплой</text><rect x="0" y="1320" width="1120" height="140" fill="#fbf3f2"/><rect x="0" y="1320" width="44" height="140" fill="#f1d6d1"/><text transform="translate(22.0,1390.0) rotate(-90)" font-size="13.5" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#1f2a37">Неуспех</text><line x1="0" y1="210" x2="1120" y2="210" stroke="#9aa5b1" stroke-width="1"/><line x1="0" y1="500" x2="1120" y2="500" stroke="#9aa5b1" stroke-width="1"/><line x1="0" y1="650" x2="1120" y2="650" stroke="#9aa5b1" stroke-width="1"/><line x1="0" y1="930" x2="1120" y2="930" stroke="#9aa5b1" stroke-width="1"/><line x1="0" y1="1320" x2="1120" y2="1320" stroke="#9aa5b1" stroke-width="1"/><line x1="44" y1="0" x2="44" y2="1460" stroke="#9aa5b1" stroke-width="1"/><rect x="0.5" y="0.5" width="1119" height="1459" fill="none" stroke="#9aa5b1" stroke-width="1"/><rect x="860" y="34" width="40" height="22" rx="6" fill="#ffffff" stroke="#3b4a5c" stroke-width="1.4"/><text x="880.0" y="45.0" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" ></text><text x="912" y="45.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#4a5563" >шаг процесса</text><path d="M860,82 L898,82" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#g)"/><text x="912" y="82.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#4a5563" >первая модель пары</text><path d="M860,116 L900,116" fill="none" stroke="#b3402f" stroke-width="1.6" stroke-linejoin="round"/><text x="912" y="116.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#4a5563" >путь неуспеха</text><line x1="860" y1="150" x2="900" y2="150" stroke="#3b4a5c" stroke-width="1.6"/><text x="912" y="150.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#2f6aa3" font-style="italic">результат шага</text><text x="150" y="22.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >Каждую ночь в 03:00 МСК,</text><text x="150" y="38.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >если пришли новые свечи</text><circle cx="150" cy="90" r="14" fill="#e9f6ec" stroke="#2e7d32" stroke-width="1.6"/><path d="M150,104 L150,124" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round"/><text x="405" y="22.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >Каждый час: MAPE прогнозов</text><text x="405" y="38.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >> 3 % (≥ 10 прогнозов,</text><text x="405" y="54.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >пауза 24 ч)</text><circle cx="405" cy="90" r="14" fill="#e9f6ec" stroke="#2e7d32" stroke-width="1.6"/><path d="M405,104 L405,124" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round"/><text x="650" y="22.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >Ручной запуск</text><text x="650" y="38.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >POST /api/v1/retrain</text><circle cx="650" cy="90" r="14" fill="#e9f6ec" stroke="#2e7d32" stroke-width="1.6"/><path d="M650,104 L650,124" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round"/><path d="M150,124 L650,124" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round"/><path d="M360,124 L360,146" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><rect x="210" y="148" width="300" height="48" rx="6" fill="#ffffff" stroke="#3b4a5c" stroke-width="1.4"/><text x="360.0" y="163.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >Проверка: обучение не идёт;</text><text x="360.0" y="180.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >запись run (status = running)</text><path d="M360,196 L360,234" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><text x="372" y="216.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#2f6aa3" font-style="italic">run_id</text><rect x="210" y="236" width="300" height="50" rx="6" fill="#ffffff" stroke="#3b4a5c" stroke-width="1.4"/><text x="360.0" y="252.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >Выгрузка всех завершённых</text><text x="360.0" y="269.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >свечей из PostgreSQL</text><path d="M360,286 L360,307" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><text x="372" y="297.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#2f6aa3" font-style="italic">ряд OHLCV</text><polygon points="360,309.0 470.0,355 360,401.0 250.0,355" fill="#fff6dc" stroke="#a87b00" stroke-width="1.4"/><text x="360" y="347.5" font-size="12.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >Свечей достаточно?</text><text x="360" y="362.5" font-size="12.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >(≥ 100 + 20)</text><path d="M470,355 L820,355" fill="none" stroke="#b3402f" stroke-width="1.6" stroke-linejoin="round"/><text x="520" y="343.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >нет</text><path d="M360,401 L360,430" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><text x="372" y="416.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#4a5563" >да</text><rect x="210" y="432" width="300" height="50" rx="6" fill="#ffffff" stroke="#3b4a5c" stroke-width="1.4"/><text x="360.0" y="448.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >Расчёт 25 признаков;</text><text x="360.0" y="465.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >последние 20 свечей — отложенная выборка</text><path d="M360,482 L360,543" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><text x="372" y="512.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#2f6aa3" font-style="italic">обучающая выборка</text><rect x="210" y="545" width="300" height="60" rx="6" fill="#ffffff" stroke="#3b4a5c" stroke-width="1.4"/><text x="360.0" y="566.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >Обучение AutoGluon (MAPE)</text><text x="360.0" y="583.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >в каталог кандидата</text><path d="M510,575 L820,575" fill="none" stroke="#b3402f" stroke-width="1.6" stroke-linejoin="round"/><text x="665" y="563.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >ошибка обучения</text><path d="M360,605 L360,688" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><text x="372" y="628.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#2f6aa3" font-style="italic">модель-кандидат</text><rect x="210" y="690" width="300" height="60" rx="6" fill="#ffffff" stroke="#3b4a5c" stroke-width="1.4"/><text x="360.0" y="711.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >Прогноз 20 отложенных свечей:</text><text x="360.0" y="728.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >новая и рабочая модель, Naive</text><path d="M360,750 L360,782" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><text x="372" y="766.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#2f6aa3" font-style="italic">MAPE моделей</text><polygon points="360,784.0 480.0,830 360,876.0 240.0,830" fill="#fff6dc" stroke="#a87b00" stroke-width="1.4"/><text x="360" y="822.5" font-size="12.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >MAPE новой ≤</text><text x="360" y="837.5" font-size="12.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >MAPE рабочей?</text><path d="M480,830 L820,830" fill="none" stroke="#b3402f" stroke-width="1.6" stroke-linejoin="round"/><text x="530" y="818.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >нет</text><path d="M360,876 L360,958" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><text x="372" y="905.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#4a5563" >да</text><rect x="210" y="960" width="300" height="60" rx="6" fill="#ffffff" stroke="#3b4a5c" stroke-width="1.4"/><text x="360.0" y="981.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >Замена рабочей модели;</text><text x="360.0" y="998.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >прежняя сохраняется как __previous</text><path d="M360,1020 L360,1048" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><text x="372" y="1034.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#2f6aa3" font-style="italic">модель на диске</text><rect x="210" y="1050" width="300" height="60" rx="6" fill="#ffffff" stroke="#3b4a5c" stroke-width="1.4"/><text x="360.0" y="1071.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >Регистрация версии</text><text x="360.0" y="1088.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >в MLflow Model Registry</text><path d="M360,1110 L360,1138" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><text x="372" y="1124.0" font-size="12" text-anchor="start" dominant-baseline="central" font-weight="normal" fill="#2f6aa3" font-style="italic">номер версии</text><rect x="210" y="1140" width="300" height="60" rx="6" fill="#ffffff" stroke="#3b4a5c" stroke-width="1.4"/><text x="360.0" y="1161.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >Сброс кэша: следующий прогноз</text><text x="360.0" y="1178.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >загружает новую модель</text><path d="M360,1200 L360,1238" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><rect x="210" y="1240" width="300" height="50" rx="25.0" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2.4"/><text x="360.0" y="1265.0" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >Новая модель в эксплуатации</text><path d="M210,575 L150,575 L150,1080 L208,1080" fill="none" stroke="#2e7d32" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#g)"/><text x="97" y="812.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >первая</text><text x="97" y="828.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >модель:</text><text x="97" y="844.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >без</text><text x="97" y="860.0" font-size="12" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#4a5563" >сравнения</text><path d="M820,355 L820,1358" fill="none" stroke="#b3402f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#f)"/><rect x="600" y="1360" width="490" height="60" rx="6" fill="#ffffff" stroke="#b3402f" stroke-width="1.4"/><text x="845.0" y="1381.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >Статус error или rejected с причиной;</text><text x="845.0" y="1398.5" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >рабочая модель и кэш не меняются</text><path d="M600,1390 L512,1390" fill="none" stroke="#3b4a5c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a)"/><rect x="210" y="1366" width="300" height="48" rx="24.0" fill="#fdf1ef" stroke="#b3402f" stroke-width="2.4"/><text x="360.0" y="1390.0" font-size="13.5" text-anchor="middle" dominant-baseline="central" font-weight="normal" fill="#1f2a37" >Ожидание следующего запуска</text></svg>